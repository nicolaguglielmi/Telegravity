name: Publish to PyPI

# Publishes on every v* tag push. Uses PyPI Trusted Publishing (OIDC):
# no API token is stored anywhere — GitHub proves the workflow's identity
# to PyPI directly. Can also be run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches telegravity/__version__.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('telegravity/__version__.py').read_text()).group(1))")
          echo "tag=$TAG  __version__=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG does not match __version__ $VERSION"; exit 1; }
      - name: Build sdist + wheel
        run: python -m pip install --upgrade build && python -m build
      - name: Check metadata
        run: python -m pip install --upgrade twine && twine check dist/*
      - name: Scan artifacts for secrets and stray copies of the repo
        run: |
          mkdir -p _scan && tar -xzf dist/*.tar.gz -C _scan
          fail=0
          # An agent worktree or a nested checkout would ship the whole repo,
          # including states we deliberately rewrote out of history.
          if find _scan -type d \( -name ".claude" -o -name "worktrees" -o -name "data" \) | grep -q .; then
            echo "::error::sdist contains a directory that must never ship"; fail=1
          fi
          if grep -rIEq "[A-Za-z0-9._%+-]+@(gmail|outlook|yahoo|hotmail)\.[a-z]+" _scan; then
            echo "::error::sdist contains a personal email address"; fail=1
          fi
          if grep -rIEq "TELEGRAM_TOKEN[[:space:]]*=[[:space:]]*[0-9]{8,}:[A-Za-z0-9_-]{30,}" _scan; then
            echo "::error::sdist contains what looks like a real bot token"; fail=1
          fi
          test "$fail" = "0" && echo "artifacts clean"
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
